# Savanna Odoo 18 Onboarding Stack
# Author: Adam ChapChap Ng'uni — Created: 2025-08-09

services:
  onboarding_web:
    profiles: ["onboarding"]
    build:
      context: ./onboarding_web/app
      dockerfile: Dockerfile
    image: savanna/onboarding_web:latest
    container_name: onboarding_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ODOO_COMMUNITY_EXTERNAL: "http://localhost:8069"
      ODOO_ENTERPRISE_EXTERNAL: "http://localhost:8070"
      ODOO_COMMUNITY_URL: "http://odoo_community:8069"
      ODOO_ENTERPRISE_URL: "http://odoo_enterprise:8069"
      MASTER_PASSWORD: "${MASTER_PASSWORD:-M@st3r-0d00-551-2025#Zk9Ld8}"
      DATABASE_URL: "postgresql://clientadmin:clientpass@pg_clients/clients"
      ONBOARD_DEBUG: "${ONBOARD_DEBUG:-0}"
    depends_on:
      pg_clients:
        condition: service_started
    volumes:
      - ./onboarding_web/app:/app
      # ⬇️ ensures /app/static/sslogo.png is served by FastAPI's StaticFiles
      - ./onboarding_web/app/static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo_community:
    profiles: ["core"]
    image: odoo:18.0
    container_name: odoo_community
    restart: unless-stopped
    ports:
      - "8069:8069"
    volumes:
      - odoo_community_data:/var/lib/odoo
      - ./odoo_conf/community:/etc/odoo:ro
    depends_on:
      pg_community:
        condition: service_healthy

  odoo_enterprise:
    profiles: ["core"]
    image: odoo:18.0
    container_name: odoo_enterprise
    restart: unless-stopped
    ports:
      - "8070:8069"
    volumes:
      - odoo_enterprise_data:/var/lib/odoo
      - ./odoo_conf/enterprise:/etc/odoo:ro
    depends_on:
      pg_enterprise:
        condition: service_healthy

  pg_community:
    profiles: ["core"]
    image: postgres:16
    container_name: pg_community
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pg_community_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg_enterprise:
    profiles: ["core"]
    image: postgres:16
    container_name: pg_enterprise
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pg_enterprise_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg_clients:
    profiles: ["onboarding"]
    image: postgres:16
    container_name: pg_clients
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientadmin
      POSTGRES_PASSWORD: clientpass
      POSTGRES_DB: clients
    volumes:
      - pg_clients_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientadmin -d clients"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  odoo_community_data:
  odoo_enterprise_data:
  pg_community_data:
  pg_enterprise_data:
  pg_clients_data:
