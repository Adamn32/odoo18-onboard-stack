<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creating database "{{ db_name }}"</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    body {
      align-items: center;
      min-height: 100vh;
    }
    .progress-card {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(180deg, rgba(11, 18, 32, 0.95), rgba(8, 12, 24, 0.98));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: springUp 0.6s var(--spring-smooth) both;
    }
    .progress-card:before {
      content: '';
      position: absolute;
      inset: -2px -2px auto -2px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: blur(4px);
      opacity: 0.9;
    }
    .status-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .status-icon.loading {
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    .status-icon.success {
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid var(--success);
    }
    .status-icon.success svg {
      animation: checkBounce 0.5s var(--spring-bounce) both;
    }
    .status-icon.error {
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid var(--error);
      animation: errorShake 0.4s var(--ease-in-out);
    }
    .status-icon.error svg {
      animation: springScale 0.3s var(--spring-bounce) both;
    }
    .db-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .db-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .edition-label {
      font-size: 13px;
      color: var(--accent-2);
      margin-bottom: 24px;
    }
    #msg {
      color: var(--text-2);
      font-size: 14px;
      transition: all var(--dur-normal) var(--ease-in-out);
    }
    #msg.ok { color: var(--success); }
    #msg.err { color: var(--error); }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .mono {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .log {
      background: rgba(11, 16, 33, 0.8);
      color: var(--text-2);
      text-align: left;
      border-radius: var(--radius-xs);
      padding: 12px 14px;
      overflow: auto;
      max-height: 200px;
      border: 1px solid var(--line);
      margin-top: 8px;
    }
    details {
      margin-top: 20px;
    }
    details summary {
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    details summary:hover {
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <div class="progress-card">
    <div class="status-icon loading" id="statusIcon">
      <svg id="statusSvg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="db-label">Database</div>
    <div class="db-name">{{ db_name }}</div>
    <div class="edition-label">{{ edition }}</div>

    <div id="msg">Talking to Odoo&hellip;</div>

    <div class="actions">
      <button id="retry" class="btn btn-secondary" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Retry
      </button>
      <a id="back" class="btn btn-secondary" href="javascript:history.back()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </a>
    </div>

    <details>
      <summary>Show request details</summary>
      <pre class="log mono" id="log"></pre>
    </details>
  </div>

  <script>
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) history.back();
    });

    const payload = {{ payload | tojson | safe }};
    const msg = document.getElementById('msg');
    const logEl = document.getElementById('log');
    const retryBtn = document.getElementById('retry');
    const statusIcon = document.getElementById('statusIcon');
    const statusSvg = document.getElementById('statusSvg');

    function setStatus(type, text) {
      statusIcon.className = 'status-icon ' + type;
      if (type === 'success') {
        statusSvg.style.display = 'block';
        statusSvg.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
        statusSvg.style.color = 'var(--success)';
      } else if (type === 'error') {
        statusSvg.style.display = 'block';
        statusSvg.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
        statusSvg.style.color = 'var(--error)';
      }
      msg.textContent = text;
    }

    function setMsg(txt, cls) {
      msg.className = cls || '';
      msg.textContent = txt;
    }

    function writeLog(obj) {
      try {
        logEl.textContent = JSON.stringify(obj, null, 2);
      } catch {
        logEl.textContent = String(obj);
      }
    }

    async function createOnce() {
      retryBtn.style.display = 'none';
      statusSvg.style.display = 'none';
      statusIcon.className = 'status-icon loading';
      setMsg('Talking to Odoo\u2026');
      writeLog({ endpoint: '/api/create-db', payload: { ...payload, db_password: '***masked***' } });

      try {
        const res = await fetch('/api/create-db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          cache: 'no-store',
        });

        const json = await res.json().catch(() => ({}));
        writeLog({ status: res.status, body: json });

        if (res.ok && json && json.ok && json.redirect) {
          setStatus('success', 'Database ready. Redirecting&hellip;');
          await new Promise(r => setTimeout(r, 600));
          window.location.replace(json.redirect);
          return;
        }

        if (res.status === 409) {
          setStatus('error', 'This request expired. Please go back and submit again.');
        } else if (json && json.error) {
          setStatus('error', json.error);
        } else {
          setStatus('error', 'Unexpected response from server.');
        }
        retryBtn.style.display = 'inline-flex';
      } catch (e) {
        setStatus('error', 'Network error: ' + e);
        writeLog({ error: String(e) });
        retryBtn.style.display = 'inline-flex';
      }
    }

    retryBtn.addEventListener('click', createOnce);
    createOnce();

    if (window.history.replaceState) {
      window.history.replaceState(null, '', window.location.href);
    }
  </script>
</body>
</html>
