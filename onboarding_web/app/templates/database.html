<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Database – {{ edition }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
</head>
<body>
  <div class="card">
    <div class="brand-row">
      <img src="{{ url_for('static', path='sslogo.png') }}" alt="Savanna Solutions Logo" />
      <span class="pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        {{ edition }}
      </span>
    </div>

    <h2>Create Client Database</h2>
    <p class="helper">
      We'll provision your Odoo instance with the options below.
      Your domain name choice was captured in step 1.
    </p>

    <form method="post" action="/create-db" class="stagger">
      <input type="hidden" name="edition" value="{{ edition }}" />

      <div>
        <label for="db_name">Database Name</label>
        <div class="field">
          <input class="ro" type="text" id="db_name" name="db_name" value="{{ last_db_name }}" readonly required />
        </div>
      </div>

      <div>
        <label for="db_password">Database Password</label>
        <div class="field">
          <input type="password" id="db_password" name="db_password" placeholder="Set an admin password" required />
        </div>
      </div>

      <div>
        <label for="phone">Phone Number</label>
        <div class="field">
          <input type="text" id="phone" name="phone" placeholder="e.g. 0966662326" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="lang">Language</label>
          <div class="field">
            <select id="lang" name="lang" required>
              <option value="en_US" selected>English (US)</option>
              <option value="fr_FR">French</option>
              <option value="pt_BR">Portuguese (Brazil)</option>
            </select>
          </div>
        </div>
        <div>
          <label for="country">Country</label>
          <div class="field">
            <select id="country" name="country" required>
              <option value="ZM" selected>Zambia</option>
              <option value="ZA">South Africa</option>
              <option value="KE">Kenya</option>
            </select>
          </div>
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="demo" name="demo" />
        <label for="demo">Include demo data</label>
      </div>

      <button class="btn" type="submit" id="submitBtn">
        <span class="btn-text">Create Database</span>
        <span class="btn-spinner"></span>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('intakeForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
    });
  </script>
</body>
</html>
