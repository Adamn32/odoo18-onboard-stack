<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odoo Onboarding – Savanna Solutions</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="{{ url_for('static', path='sslogo.png') }}" alt="Savanna Solutions Logo" />
    </div>

    <h2>Client Onboarding</h2>
    <p class="helper">Fill in the details below to prepare your Odoo environment.</p>

    <form method="post" action="/submit" id="intakeForm" novalidate class="stagger">
      <div>
        <label for="company_name">Company Name</label>
        <div class="field">
          <input type="text" id="company_name" name="company_name" placeholder="e.g. Savanna Solutions" required />
        </div>
      </div>

      <div>
        <label for="db_name">Database Name</label>
        <div class="field">
          <input type="text" id="db_name" name="db_name" placeholder="e.g. savanna, savanna_test" required pattern="[a-z0-9_]+" />
        </div>
        <div class="hint">Allowed: lowercase letters, numbers, underscores.</div>
      </div>

      <div>
        <label for="admin_email">Admin Email</label>
        <div class="field">
          <input type="email" id="admin_email" name="admin_email" placeholder="admin@company.com" required />
        </div>
      </div>

      <div>
        <label for="domain_name">Do you have a Domain Name? (Y/N)</label>
        <div class="field">
          <input type="text" id="domain_name" name="domain_name" placeholder="Y or N" pattern="[YyNn]" maxlength="1" value="N" required />
        </div>
      </div>

      <div id="nameDomainGroup" class="hidden">
        <label for="name_domain_name">Domain Name</label>
        <div class="field">
          <input type="text" id="name_domain_name" name="name_domain_name" placeholder="e.g. example.com" />
        </div>
      </div>

      <div>
        <label for="odoo_edition">Select Odoo Edition</label>
        <div class="field">
          <select id="odoo_edition" name="odoo_edition" required>
            <option value="Community">Community Edition</option>
            <option value="Enterprise">Enterprise Edition</option>
          </select>
        </div>
      </div>

      <button class="btn" type="submit" id="submitBtn">
        <span class="btn-text">Next</span>
        <span class="btn-spinner"></span>
      </button>
    </form>
  </div>

  <script>
    const dbInput = document.getElementById('db_name');
    dbInput.addEventListener('input', () => {
      dbInput.value = dbInput.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    });

    const domainYN = document.getElementById('domain_name');
    const nameGroup = document.getElementById('nameDomainGroup');

    function toggleNameDomain() {
      const val = (domainYN.value || '').trim().toLowerCase();
      const isYes = val === 'y';

      if (isYes) {
        nameGroup.classList.remove('hidden');
        nameGroup.style.animation = 'fadeSlideUp 0.3s cubic-bezier(0.23, 1, 0.32, 1) both';
      } else {
        nameGroup.classList.add('hidden');
        const nm = document.getElementById('name_domain_name');
        if (nm) nm.value = '';
      }
    }

    toggleNameDomain();
    domainYN.addEventListener('input', toggleNameDomain);
    domainYN.addEventListener('change', toggleNameDomain);

    const form = document.getElementById('intakeForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', () => {
      btn.classList.add('loading');
      btn.disabled = true;
    });
  </script>
</body>
</html>
