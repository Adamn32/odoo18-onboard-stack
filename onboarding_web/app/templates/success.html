<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  <style>
    body { align-items: center; min-height: 100vh; }
    .success-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, rgba(8, 24, 18, 0.95), rgba(6, 18, 14, 0.98));
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(16, 185, 129, 0.1);
      padding: 36px 28px;
      text-align: center;
      animation: springUp 0.5s var(--spring-smooth) both;
    }
    .success-card:before {
      content: '';
      position: absolute;
      inset: -2px -2px auto -2px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--cta), transparent);
      filter: blur(4px);
      opacity: 0.7;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-icon svg {
      color: var(--cta);
      animation: checkBounce 0.5s var(--spring-bounce) both;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      background: none;
      -webkit-text-fill-color: initial;
      color: var(--text);
    }
    .msg {
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card success-card">
    <div class="success-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>Database creation triggered</h2>
    <p class="msg">{{ message }}</p>
    {% if redirect_url %}
    <a class="btn" href="{{ redirect_url }}" style="width:auto;padding:12px 24px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Log into Odoo
    </a>
    {% endif %}
  </div>
</body>
</html>
